# System-wide Configuration

# Target assets configuration
ticker: "SPY"

# Data parameters
data:
  raw_dir: "data/raw"
  historical_dir: "data/historical"
  processed_dir: "data/processed"
  
  # Temporal sequence settings
  lookback: 20            # L: number of days of history input
  forecast_horizons: [1, 5, 10]  # h: step ahead prediction targets

  # Chronological split ratios (must sum to 1.0)
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2

  # Standardized spatial grid limits and coordinates
  # Moneyness kappa: ln(K/F)
  moneyness_grid: [-0.30, -0.20, -0.10, 0.00, 0.10, 0.20, 0.30]
  # Expiry tau: (T - t) / 252 (in years)
  expiry_grid: [0.01923, 0.03846, 0.08333, 0.16667, 0.25, 0.5, 1.0] # 1w, 2w, 1m, 2m, 3m, 6m, 1y

# Model parameters (to be expanded by Developer B)
model:
  name: "convlstm"
  convlstm:
    hidden_dim: [32, 64, 64]
    kernel_size: [3, 3]
    num_layers: 3
  lstm:
    hidden_dim: 256
    num_layers: 3

# Training execution parameters
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  early_stopping_patience: 15
  grad_clip: 1.0
  seed: 42
  loss:
    lambda_strike: 0.01
    lambda_expiry: 0.01
    lambda_calendar: 0.0   # optional calendar spread regularization
    lambda_butterfly: 0.0  # optional butterfly spread regularization

# Serving & Monitoring parameters
serving:
  host: "127.0.0.1"
  port: 8000
  model_registry_uri: "mlruns"
  model_name: "volatility_surface_forecaster"
  
monitoring:
  rolling_window_days: 10
  kl_threshold: 0.5            # critical KL divergence for data drift
  rmse_threshold_factor: 1.5   # retraining trigger (e.g. 1.5x baseline RMSE)
